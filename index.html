<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>約時間小幫手🙋‍♀️</title>
<meta name="description" content="點日期、選時段，中英文會議時段文字自動複製，直接貼進 LINE 或 Email。">
<style>
  :root{
    --paper:#f5f5f4; --card:#ffffff; --ink:#292524; --muted:#78716c;
    --line:#e7e5e4; --green:#047857; --green-soft:#ecfdf5; --red:#be123c;
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,-apple-system,"Segoe UI",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
    .wrap{max-width:780px;margin:0 auto;padding:24px 16px 56px}
  header{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:20px}
  header>div:first-child{flex:1 1 auto;min-width:0}
  h1{font-size:24px;line-height:1.3;margin:0;letter-spacing:-.01em}
  .sub{font-size:14px;line-height:1.7;color:var(--muted);margin:8px 0 0;max-width:none;white-space:pre-line}
  .langs{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;flex:0 0 auto;background:#fff}
  .langs button{border:0;background:#fff;color:var(--muted);font:inherit;font-size:14px;padding:6px 14px;cursor:pointer}
  .langs button.on{background:var(--green);color:#fff}
  .bubble{background:var(--green);color:#fff;border-radius:18px;padding:16px 20px;min-height:96px}
  .bubble pre{margin:0;font:inherit;font-size:15px;line-height:1.75;white-space:pre-wrap;word-break:break-word;user-select:all}
  .bubble .placeholder{color:#a7f3d0;font-size:15px;line-height:1.75;margin:0}
  .bar{display:flex;align-items:center;gap:12px;margin-top:10px;flex-wrap:wrap}
  .primary{border:0;background:#292524;color:#fff;font:inherit;font-size:14px;padding:9px 18px;border-radius:999px;cursor:pointer}
  .primary:disabled{background:#d6d3d1;cursor:default}
  .link{border:0;background:none;color:var(--muted);font:inherit;font-size:14px;text-decoration:underline;text-underline-offset:4px;cursor:pointer}
  .toast{font-size:14px;color:var(--green)}
  .toast.err{color:var(--red)}
  label.field{display:block;font-size:14px;color:var(--muted);margin:24px 0 6px}
  select,input[type=text]{width:100%;font:inherit;font-size:14px;padding:9px 10px;border:1px solid #d6d3d1;border-radius:10px;background:#fff;color:var(--ink)}
  .cols{display:grid;gap:20px;margin-top:24px}
  @media(min-width:720px){.cols{grid-template-columns:1fr 1fr}}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
  .mhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
  .mhead span{font-size:14px;font-weight:600}
  .mhead button{width:32px;height:32px;border:0;background:none;border-radius:999px;color:var(--muted);font-size:18px;cursor:pointer}
  .mhead button:hover{background:#f5f5f4}
  .grid7{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
  .wd{text-align:center;font-size:12px;color:#a8a29e;padding:4px 0}
  .day{height:38px;border:0;background:none;border-radius:10px;font:inherit;font-size:14px;color:#44403c;cursor:pointer}
  .day:hover{background:#f5f5f4}
  .day.sel{background:var(--green);color:#fff;font-weight:600}
  .day.today{box-shadow:inset 0 0 0 1px var(--green)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px}
  .card .row{display:flex;align-items:center;justify-content:space-between}
  .card .row strong{font-size:14px}
  .x{border:0;background:none;color:#a8a29e;font-size:13px;cursor:pointer}
  .x:hover{color:var(--red)}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
  .chip{display:inline-flex;align-items:center;gap:6px;background:var(--green-soft);color:#065f46;font-size:12px;padding:5px 10px;border-radius:999px}
  .chip button{border:0;background:none;color:#059669;cursor:pointer;font-size:12px;padding:0}
  .card select{margin-top:8px}
  .customrow{display:flex;gap:8px;margin-top:8px}
  .customrow button{border:0;background:var(--green);color:#fff;font:inherit;font-size:14px;padding:0 14px;border-radius:10px;cursor:pointer}
  .hidden{display:none}
  .hint{font-size:14px;color:#a8a29e;padding-top:6px}
  .note{margin-top:36px;padding-top:16px;border-top:1px solid var(--line)}
  .note p{margin:0;font-size:13px;line-height:1.7;color:#a8a29e}
  .note.warn{border-top-color:#fecdd3}
  .note.warn p{color:var(--red)}
  .credit{margin:4px 0 0;font-size:12px;color:#a8a29e;text-align:center}
  .hits{margin:10px 0 0;font-size:12px;color:#a8a29e;text-align:center}
  :focus-visible{outline:2px solid var(--green);outline-offset:2px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1 id="title">約時間小幫手🙋‍♀️</h1>
      <p class="sub" id="sub"></p>
    </div>
    <div class="langs">
      <button id="btn-zh" class="on">中文</button>
      <button id="btn-en">EN</button>
    </div>
  </header>

  <div class="bubble" id="bubble"></div>
  <div class="bar">
    <button class="primary" id="copy"></button>
    <button class="link hidden" id="clear"></button>
    <span class="toast hidden" id="toast"></span>
  </div>

  <label class="field" for="opening" id="opening-label"></label>
  <select id="opening"></select>
  <input type="text" id="opening-custom" class="hidden" style="margin-top:8px">

  <div class="cols">
    <div class="panel">
      <div class="mhead">
        <button id="prev" aria-label="上個月">‹</button>
        <span id="mlabel"></span>
        <button id="next" aria-label="下個月">›</button>
      </div>
      <div class="grid7" id="wdrow"></div>
      <div class="grid7" id="days" style="margin-top:4px"></div>
    </div>
    <div id="slots"></div>
  </div>

  <div class="note hidden" id="note"></div>
  <p class="hits hidden" id="hits"></p>
  <p class="credit">© 2026 rubytsaitw</p>
</div>

<script>
/* =======================================================================
   星期計算：兩套完全獨立的演算法，結果一致才輸出
   A：JS Date，以「當地中午」建立，避開 UTC 字串解析與日光節約時間邊界
   B：Sakamoto 演算法，純整數運算，不碰任何內建日期物件
   ======================================================================= */
function weekdayA(y,m,d){ return new Date(y, m-1, d, 12, 0, 0).getDay(); }   // 0 = 週日
function weekdayB(y,m,d){
  const t=[0,3,2,5,0,3,5,1,4,6,2,4];
  let yy=y; if(m<3) yy-=1;
  return (yy + Math.floor(yy/4) - Math.floor(yy/100) + Math.floor(yy/400) + t[m-1] + d) % 7;
}
function isLeap(y){ return (y%4===0 && y%100!==0) || y%400===0; }
function daysInMonth(y,m){ return m===2 && isLeap(y) ? 29 : [31,28,31,30,31,30,31,31,30,31,30,31][m-1]; }
function weekday(y,m,d){
  const a=weekdayA(y,m,d), b=weekdayB(y,m,d);
  if(a!==b) throw new Error('weekday mismatch '+y+'/'+m+'/'+d);
  return a;
}
function selfTest(){
  let checked=0, mismatch=0;
  for(let y=1900;y<=2100;y++)
    for(let m=1;m<=12;m++){
      const dim=daysInMonth(y,m);
      for(let d=1;d<=dim;d++){ checked++; if(weekdayA(y,m,d)!==weekdayB(y,m,d)) mismatch++; }
    }
  const anchors=[[2000,1,1,6],[2024,2,29,4],[1900,1,1,1],[2026,9,2,3]];
  const anchorFail=anchors.filter(a=>weekdayA(a[0],a[1],a[2])!==a[3]||weekdayB(a[0],a[1],a[2])!==a[3]).length;
  return {checked:checked, ok: mismatch===0 && anchorFail===0};
}

/* ===================== 文案 ===================== */
const WD={zh:['週日','週一','週二','週三','週四','週五','週六'],
          en:['Sun.','Mon.','Tue.','Wed.','Thu.','Fri.','Sat.']};
const HEAD={zh:['日','一','二','三','四','五','六'],en:['S','M','T','W','T','F','S']};
const MONTHS_EN=['January','February','March','April','May','June','July','August','September','October','November','December'];
const TIMES=[
  {zh:'09:00–10:00',en:'09:00–10:00'},{zh:'10:00–11:00',en:'10:00–11:00'},
  {zh:'11:00–12:00',en:'11:00–12:00'},{zh:'13:00–14:00',en:'13:00–14:00'},
  {zh:'14:00–15:00',en:'14:00–15:00'},{zh:'15:00–16:00',en:'15:00–16:00'},
  {zh:'16:00–17:00',en:'16:00–17:00'},
  {zh:'上午皆可',en:'Morning'},{zh:'下午皆可',en:'Afternoon'},{zh:'全天皆可',en:'Any time'}
];
const OPENINGS={
  zh:['提供以下時段供您參考','以下時段我這邊方便，再麻煩您挑一個：','這幾個時間我都可以，看您方便：','會議時間確認如下：'],
  en:['Here are some times for your reference:','Please let me know which of these suits you:',"I'm available at any of these times:",'Meeting time confirmed as below:']
};
const T={
  zh:{sub:'用文字約時間很麻煩嗎？\n現在動動手指就搞定：點日期、選時段，文字自動複製，貼進 LINE 或 Email。',
      opening:'開頭語',custom:'自訂…',customTime:'＋ 自訂時間…',addTime:'選一個時段',
      copy:'複製這段文字',copied:'✓ 已複製',failed:'複製失敗，請直接長按選取上方文字',
      empty:'還沒選日期。點下方日曆選一天，可以複選。',clear:'全部清空',add:'加入',
      hint:'沒有選時段的日期，只會輸出日期。',
      note:'星期幾：由程式即時計算',
      hits:function(n){return '累計 '+n+' 位訪客';},
      broken:'日期計算異常，請重新整理頁面。'},
  en:{sub:'Sorting out meeting times by text is a pain, right?\nNow it takes a few taps: pick a date, pick a slot, text copied, paste into LINE or email.',
      opening:'Opening line',custom:'Custom…',customTime:'+ Custom time…',addTime:'Add a time slot',
      copy:'Copy this text',copied:'✓ Copied',failed:'Copy blocked — select the text above manually',
      empty:'No dates yet. Tap the calendar below; you can pick several.',clear:'Clear all',add:'Add',
      hint:'A date with no slot prints as a date only.',
      note:'Weekday: calculated automatically',
      hits:function(n){return n+' visitors';},
      broken:'Something went wrong with the date calculation. Please refresh the page.'}
};

/* ===================== 狀態 ===================== */
const now=new Date();
const TODAY={y:now.getFullYear(),m:now.getMonth()+1,d:now.getDate()};
let lang='zh';
let view={y:TODAY.y,m:TODAY.m};
let slots=[];               // {y,m,d,times:[{zh,en}]}
let openIdx=0;
let openCustom='';
let test=null;
let hits=null;

const $=function(id){return document.getElementById(id);};
const keyOf=function(s){return s.y+'-'+s.m+'-'+s.d;};
const sortSlots=function(l){return l.slice().sort(function(a,b){return a.y-b.y||a.m-b.m||a.d-b.d;});};
function labelOf(s){
  const w=WD[lang][weekday(s.y,s.m,s.d)];
  return lang==='zh' ? s.m+'/'+s.d+'（'+w+'）' : s.m+'/'+s.d+'('+w+')';
}
function openingText(){
  return openIdx===OPENINGS[lang].length ? openCustom : OPENINGS[lang][openIdx];
}
function buildText(){
  if(!test||!test.ok) return '';
  const bullet = lang==='zh' ? '・' : '- ';
  const lines=[];
  sortSlots(slots).forEach(function(s){
    const label=labelOf(s);
    if(s.times.length===0) lines.push(bullet+label);
    else s.times.forEach(function(t){ lines.push(bullet+label+' '+t[lang]); });
  });
  if(!lines.length) return '';
  return [openingText().trim()].concat(lines).filter(Boolean).join('\n');
}

/* ===================== 複製 ===================== */
async function copyText(text){
  try{
    if(navigator.clipboard && window.isSecureContext){ await navigator.clipboard.writeText(text); return true; }
  }catch(e){}
  try{
    const ta=document.createElement('textarea');
    ta.value=text; ta.setAttribute('readonly','');
    ta.style.position='fixed'; ta.style.top='0'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0,ta.value.length);
    const ok=document.execCommand('copy'); document.body.removeChild(ta); return ok;
  }catch(e){ return false; }
}
let toastTimer=null;
async function autoCopy(){
  const text=buildText();
  if(!text) return;
  const ok=await copyText(text);
  const el=$('toast');
  el.textContent = ok ? T[lang].copied : T[lang].failed;
  el.className = 'toast' + (ok?'':' err');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){ el.className='toast hidden'; },1800);
}

/* ===================== 畫面 ===================== */
function renderOutput(){
  const text=buildText();
  $('bubble').innerHTML = text
    ? '<pre></pre>'
    : '<p class="placeholder"></p>';
  $('bubble').firstChild.textContent = text || T[lang].empty;
  $('copy').textContent=T[lang].copy;
  $('copy').disabled=!text;
  $('clear').textContent=T[lang].clear;
  $('clear').className = slots.length ? 'link' : 'link hidden';
}
function renderOpening(){
  $('opening-label').textContent=T[lang].opening;
  const sel=$('opening'); sel.innerHTML='';
  OPENINGS[lang].forEach(function(o,i){
    const op=document.createElement('option'); op.value=i; op.textContent=o; sel.appendChild(op);
  });
  const op=document.createElement('option');
  op.value=OPENINGS[lang].length; op.textContent=T[lang].custom; sel.appendChild(op);
  sel.value=openIdx;
  const ci=$('opening-custom');
  ci.className = openIdx===OPENINGS[lang].length ? '' : 'hidden';
  ci.placeholder = lang==='zh' ? '自己打一句開頭…' : 'Write your own line…';
  ci.value=openCustom;
}
function renderCalendar(){
  $('mlabel').textContent = lang==='zh'
    ? view.y+' 年 '+view.m+' 月'
    : MONTHS_EN[view.m-1]+' '+view.y;
  const wd=$('wdrow'); wd.innerHTML='';
  HEAD[lang].forEach(function(h){
    const c=document.createElement('div'); c.className='wd'; c.textContent=h; wd.appendChild(c);
  });
  const box=$('days'); box.innerHTML='';
  const first=weekday(view.y,view.m,1);
  for(let i=0;i<first;i++) box.appendChild(document.createElement('div'));
  const sel={}; slots.forEach(function(s){ sel[keyOf(s)]=1; });
  for(let d=1; d<=daysInMonth(view.y,view.m); d++){
    const b=document.createElement('button');
    b.className='day'+(sel[view.y+'-'+view.m+'-'+d]?' sel':'')+
      ((view.y===TODAY.y&&view.m===TODAY.m&&d===TODAY.d)?' today':'');
    b.textContent=d;
    b.onclick=function(){ toggleDay(d); };
    box.appendChild(b);
  }
}
function renderSlots(){
  const host=$('slots'); host.innerHTML='';
  if(!slots.length){
    const p=document.createElement('p'); p.className='hint'; p.textContent=T[lang].hint;
    host.appendChild(p); return;
  }
  sortSlots(slots).forEach(function(s){
    const k=keyOf(s);
    const card=document.createElement('div'); card.className='card';

    const row=document.createElement('div'); row.className='row';
    const strong=document.createElement('strong'); strong.textContent=labelOf(s);
    const del=document.createElement('button'); del.className='x'; del.textContent='✕';
    del.onclick=function(){ slots=slots.filter(function(x){return keyOf(x)!==k;}); render(); };
    row.appendChild(strong); row.appendChild(del); card.appendChild(row);

    if(s.times.length){
      const chips=document.createElement('div'); chips.className='chips';
      s.times.forEach(function(t,i){
        const c=document.createElement('span'); c.className='chip';
        c.appendChild(document.createTextNode(t[lang]));
        const rm=document.createElement('button'); rm.textContent='✕';
        rm.onclick=function(){ s.times.splice(i,1); render(); };
        c.appendChild(rm); chips.appendChild(c);
      });
      card.appendChild(chips);
    }

    const sel=document.createElement('select');
    const ph=document.createElement('option'); ph.value=''; ph.textContent=T[lang].addTime; sel.appendChild(ph);
    TIMES.forEach(function(t,i){
      const o=document.createElement('option'); o.value=i; o.textContent=t[lang]; sel.appendChild(o);
    });
    const oc=document.createElement('option'); oc.value='c'; oc.textContent=T[lang].customTime; sel.appendChild(oc);
    card.appendChild(sel);

    const cr=document.createElement('div'); cr.className='customrow hidden';
    const inp=document.createElement('input'); inp.type='text';
    inp.placeholder = lang==='zh' ? '例如 13:30–14:30' : 'e.g. 13:30–14:30';
    const addBtn=document.createElement('button'); addBtn.textContent=T[lang].add;
    const addCustom=function(){
      const v=inp.value.trim(); if(!v) return;
      addTime(s,{zh:v,en:v});
    };
    addBtn.onclick=addCustom;
    inp.onkeydown=function(e){ if(e.key==='Enter') addCustom(); };
    cr.appendChild(inp); cr.appendChild(addBtn); card.appendChild(cr);

    sel.onchange=function(){
      const v=sel.value;
      if(v==='c'){ cr.className='customrow'; inp.focus(); sel.value=''; }
      else if(v!==''){ addTime(s,TIMES[Number(v)]); }
    };

    host.appendChild(card);
  });
}
function renderCredit(){
  const h=$('hits');
  if(hits===null){ h.className='hits hidden'; return; }
  h.className='hits';
  h.textContent=T[lang].hits(hits);
}
function renderNote(){
  const n=$('note');
  if(!test || test.checked===0){ n.className='note hidden'; return; }
  n.className = test.ok ? 'note' : 'note warn';
  n.innerHTML='<p></p>';
  n.querySelector('p').textContent = test.ok ? T[lang].note : T[lang].broken;
}
function render(){ renderOutput(); renderOpening(); renderCalendar(); renderSlots(); renderNote(); renderCredit(); }

/* ===================== 動作 ===================== */
function toggleDay(d){
  const k=view.y+'-'+view.m+'-'+d;
  const exists=slots.some(function(x){return keyOf(x)===k;});
  slots = exists ? slots.filter(function(x){return keyOf(x)!==k;})
                 : slots.concat([{y:view.y,m:view.m,d:d,times:[]}]);
  render(); autoCopy();
}
function addTime(s,t){
  if(!s.times.some(function(x){return x[lang]===t[lang];})) s.times.push(t);
  render(); autoCopy();
}

$('btn-zh').onclick=function(){ setLang('zh'); };
$('btn-en').onclick=function(){ setLang('en'); };
function setLang(l){
  if(l===lang) return;
  if(openIdx>OPENINGS[l].length) openIdx=0;
  lang=l;
  $('btn-zh').className = l==='zh' ? 'on' : '';
  $('btn-en').className = l==='en' ? 'on' : '';
  document.documentElement.lang = l==='zh' ? 'zh-Hant' : 'en';
  $('sub').textContent=T[lang].sub;
  render(); autoCopy();
}
$('opening').onchange=function(){ openIdx=Number(this.value); render(); autoCopy(); };
$('opening-custom').oninput=function(){ openCustom=this.value; renderOutput(); };
$('opening-custom').onblur=function(){ autoCopy(); };
$('copy').onclick=function(){ autoCopy(); };
$('clear').onclick=function(){ slots=[]; render(); };
$('prev').onclick=function(){ view.m--; if(view.m<1){view.m=12;view.y--;} renderCalendar(); };
$('next').onclick=function(){ view.m++; if(view.m>12){view.m=1;view.y++;} renderCalendar(); };

/* ===================== 瀏覽統計（GoatCounter）=====================
   1. 到 https://www.goatcounter.com/signup 註冊，取得自己的代號
   2. 把下面的空字串換成代號，例如 'meeting-time'
   3. 到 GoatCounter 的 Settings 勾選
      "Allow adding visitor counts on your website"，數字才會顯示在頁面上
   留空的話就完全不會載入任何統計程式碼。                                */
var GOATCOUNTER_CODE = 'meeting-time-helper';

if(GOATCOUNTER_CODE){
  const gc=document.createElement('script');
  gc.async=true; gc.src='//gc.zgo.at/count.js';
  gc.setAttribute('data-goatcounter','https://'+GOATCOUNTER_CODE+'.goatcounter.com/count');
  document.body.appendChild(gc);

  // 用特殊路徑 TOTAL 取整站總人數，避免 /index.html 與 / 路徑對不上
  fetch('https://'+GOATCOUNTER_CODE+'.goatcounter.com/counter/TOTAL.json')
    .then(function(r){
      if(!r.ok){
        console.warn('[goatcounter] 計數器回應 '+r.status+
          (r.status===403 ? '：請到 Settings 勾選 Allow adding visitor counts on your website'
                          : r.status===404 ? '：這個站台代號查不到資料' : ''));
        return null;
      }
      return r.json();
    })
    .then(function(d){
      if(d && d.count){ hits=d.count; renderCredit(); console.log('[goatcounter] 總訪客數 '+d.count+'（結果最多快取 4 小時）'); }
    })
    .catch(function(e){ console.warn('[goatcounter] 抓不到計數。若這裡是本機或預覽環境屬正常（外部連線被擋），線上版出現才需檢查廣告攔截器', e); });

  setTimeout(function(){
    if(!window.goatcounter) console.warn('[goatcounter] count.js 沒載入成功。本機或預覽環境屬正常；線上版出現多半是廣告攔截器');
  }, 4000);
}

/* ===================== 啟動 ===================== */
$('sub').textContent=T[lang].sub;
